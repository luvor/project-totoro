<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Human Flourishing OS — пять систем среды вокруг человека">
  <defs>
    <linearGradient id="fo-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1d2c"/>
      <stop offset="100%" stop-color="#122132"/>
    </linearGradient>
    <radialGradient id="fo-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0c27f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f0c27f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="600" fill="url(#fo-bg)"/>

  <g transform="translate(480,300)">
    <!-- орбиты -->
    <circle r="238" fill="none" stroke="rgba(255,255,255,0.06)"/>
    <circle r="160" fill="none" stroke="rgba(255,255,255,0.09)" stroke-dasharray="4 8"/>

    <!-- человек в центре -->
    <circle r="120" fill="url(#fo-halo)"/>
    <g fill="rgba(255,255,255,0.85)">
      <circle cy="-26" r="16"/>
      <path d="M-20 34 Q -20 -4 0 -4 Q 20 -4 20 34 Q 10 42 0 42 Q -10 42 -20 34 Z"/>
    </g>
    <text y="74" fill="rgba(255,255,255,0.7)" font-size="14" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif">человек</text>

    <!-- 5 систем на орбите -->
    <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
      <!-- Свет (вверх) -->
      <g transform="translate(0,-160)">
        <circle r="46" fill="rgba(240,194,127,0.14)" stroke="rgba(240,194,127,0.45)"/>
        <circle cy="-8" r="11" fill="#f6d9a8"/>
        <g stroke="#f6d9a8" stroke-width="2" stroke-linecap="round">
          <path d="M0 -26 V -32"/><path d="M13 -21 L 17 -25"/><path d="M-13 -21 L -17 -25"/>
        </g>
        <text y="26" fill="rgba(255,255,255,0.75)" font-size="13" font-weight="600">Свет</text>
      </g>
      <!-- Движение (право-верх) -->
      <g transform="translate(152,-49)">
        <circle r="46" fill="rgba(146,189,210,0.12)" stroke="rgba(146,189,210,0.45)"/>
        <path d="M-16 2 Q -4 -18 8 -4 T 18 0" stroke="#92bdd2" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="18" cy="0" r="4" fill="#92bdd2"/>
        <text y="26" fill="rgba(255,255,255,0.75)" font-size="13" font-weight="600">Движение</text>
      </g>
      <!-- Зелень (право-низ) -->
      <g transform="translate(94,129)">
        <circle r="46" fill="rgba(137,178,110,0.12)" stroke="rgba(137,178,110,0.45)"/>
        <path d="M0 8 V -14 M0 -6 Q -12 -10 -14 -22 Q -2 -20 0 -6 M0 -10 Q 12 -14 14 -26 Q 2 -24 0 -10" stroke="#a5c98c" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <text y="28" fill="rgba(255,255,255,0.75)" font-size="13" font-weight="600">Зелень</text>
      </g>
      <!-- Социальность (лево-низ) -->
      <g transform="translate(-94,129)">
        <circle r="46" fill="rgba(240,194,127,0.10)" stroke="rgba(240,194,127,0.4)"/>
        <g fill="rgba(246,217,168,0.9)">
          <circle cx="-9" cy="-8" r="7"/><circle cx="9" cy="-8" r="7"/>
          <path d="M-17 8 Q -9 0 -1 8 Z M1 8 Q 9 0 17 8 Z"/>
        </g>
        <text y="28" fill="rgba(255,255,255,0.75)" font-size="13" font-weight="600">Belonging</text>
      </g>
      <!-- Тишина (лево-верх) -->
      <g transform="translate(-152,-49)">
        <circle r="46" fill="rgba(146,189,210,0.10)" stroke="rgba(146,189,210,0.4)"/>
        <path d="M-14 0 Q -7 -12 0 0 T 14 0" stroke="rgba(146,189,210,0.9)" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M-14 8 Q -7 2 0 8 T 14 8" stroke="rgba(146,189,210,0.5)" stroke-width="2" fill="none" stroke-linecap="round"/>
        <text y="28" fill="rgba(255,255,255,0.75)" font-size="13" font-weight="600">Тишина</text>
      </g>
    </g>

    <!-- связи -->
    <g stroke="rgba(255,255,255,0.10)" stroke-width="1.5">
      <path d="M0 -114 V -60"/>
      <path d="M108 -35 L 60 -20"/>
      <path d="M67 92 L 38 52"/>
      <path d="M-67 92 L -38 52"/>
      <path d="M-108 -35 L -60 -20"/>
    </g>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="60" y="76" fill="rgba(255,255,255,0.85)" font-size="24" font-weight="700">Human Flourishing OS</text>
    <text x="60" y="102" fill="rgba(255,255,255,0.45)" font-size="14">Пять систем среды — повышение шансов, не гарантия здоровья</text>
    <g transform="translate(60,500)">
      <rect width="300" height="64" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <text x="18" y="27" fill="rgba(255,255,255,0.65)" font-size="13">Claims калиброваны: среда помогает,</text>
      <text x="18" y="47" fill="rgba(255,255,255,0.65)" font-size="13">но не заменяет медицину и выбор человека</text>
    </g>
  </g>
</svg>
