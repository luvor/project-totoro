<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Климатические режимы — четыре состояния одного города">
  <defs>
    <linearGradient id="cm-w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1524"/>
      <stop offset="100%" stop-color="#14283e"/>
    </linearGradient>
    <linearGradient id="cm-s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2e3a"/>
      <stop offset="100%" stop-color="#2c4a4e"/>
    </linearGradient>
    <linearGradient id="cm-storm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#1a2438"/>
    </linearGradient>
    <linearGradient id="cm-night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070d18"/>
      <stop offset="100%" stop-color="#101d30"/>
    </linearGradient>
  </defs>

  <rect width="960" height="600" fill="#0b1826"/>

  <!-- 4 панели-режима -->
  <g>
    <!-- Зима -->
    <g transform="translate(24,24)">
      <rect width="444" height="264" rx="18" fill="url(#cm-w)" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="222" cy="150" r="52" fill="#f0c27f" opacity="0.5"/>
      <circle cx="222" cy="150" r="30" fill="#f6d9a8" opacity="0.9"/>
      <g fill="rgba(255,255,255,0.2)">
        <rect x="120" y="170" width="26" height="60" rx="3"/>
        <rect x="156" y="150" width="30" height="80" rx="3"/>
        <rect x="280" y="156" width="28" height="74" rx="3"/>
        <rect x="318" y="176" width="24" height="54" rx="3"/>
      </g>
      <g fill="rgba(255,255,255,0.5)">
        <circle cx="90" cy="70" r="2"/><circle cx="150" cy="52" r="2"/><circle cx="260" cy="60" r="2"/>
        <circle cx="330" cy="48" r="2"/><circle cx="390" cy="78" r="2"/><circle cx="60" cy="120" r="2"/>
      </g>
      <text x="24" y="240" fill="rgba(255,255,255,0.8)" font-size="17" font-weight="600" font-family="ui-sans-serif, system-ui, sans-serif">Зима −35°C</text>
      <text x="24" y="240" dy="-190" fill="rgba(240,194,127,0.8)" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif">CORE 100%</text>
    </g>

    <!-- Лето -->
    <g transform="translate(492,24)">
      <rect width="444" height="264" rx="18" fill="url(#cm-s)" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="360" cy="64" r="30" fill="#f6d9a8" opacity="0.9"/>
      <g fill="rgba(137,178,110,0.7)">
        <circle cx="120" cy="180" r="18"/>
        <circle cx="160" cy="170" r="22"/>
        <circle cx="204" cy="182" r="16"/>
      </g>
      <g fill="rgba(255,255,255,0.2)">
        <rect x="250" y="150" width="30" height="80" rx="3"/>
        <rect x="290" y="132" width="34" height="98" rx="3"/>
        <rect x="334" y="160" width="26" height="70" rx="3"/>
      </g>
      <path d="M100 230 H 380" stroke="rgba(146,189,210,0.5)" stroke-width="4" stroke-linecap="round"/>
      <text x="24" y="240" fill="rgba(255,255,255,0.8)" font-size="17" font-weight="600" font-family="ui-sans-serif, system-ui, sans-serif">Лето +32°C</text>
      <text x="24" y="50" fill="rgba(146,189,210,0.85)" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif">Night purge · cooling commons</text>
    </g>

    <!-- Буран -->
    <g transform="translate(24,312)">
      <rect width="444" height="264" rx="18" fill="url(#cm-storm)" stroke="rgba(255,255,255,0.08)"/>
      <g stroke="rgba(255,255,255,0.25)" stroke-width="2" stroke-linecap="round">
        <path d="M60 60 L 120 84"/><path d="M160 48 L 230 76"/><path d="M280 56 L 350 84"/>
        <path d="M90 110 L 160 136"/><path d="M240 104 L 310 130"/><path d="M340 120 L 400 144"/>
      </g>
      <g fill="rgba(255,255,255,0.16)">
        <rect x="150" y="150" width="30" height="80" rx="3"/>
        <rect x="190" y="132" width="34" height="98" rx="3"/>
        <rect x="234" y="158" width="26" height="72" rx="3"/>
      </g>
      <path d="M120 230 Q 222 196 324 230" stroke="rgba(240,194,127,0.6)" stroke-width="3" fill="none" stroke-dasharray="6 6"/>
      <text x="24" y="240" fill="rgba(255,255,255,0.8)" font-size="17" font-weight="600" font-family="ui-sans-serif, system-ui, sans-serif">Буран · lockdown mode</text>
      <text x="24" y="50" fill="rgba(240,194,127,0.75)" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif">Крытые галереи открыты</text>
    </g>

    <!-- Ночь -->
    <g transform="translate(492,312)">
      <rect width="444" height="264" rx="18" fill="url(#cm-night)" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="370" cy="60" r="22" fill="#e8eef4" opacity="0.85"/>
      <circle cx="362" cy="54" r="20" fill="#101d30"/>
      <g fill="rgba(255,255,255,0.14)">
        <rect x="130" y="140" width="30" height="90" rx="3"/>
        <rect x="170" y="120" width="34" height="110" rx="3"/>
        <rect x="214" y="150" width="26" height="80" rx="3"/>
        <rect x="270" y="136" width="30" height="94" rx="3"/>
      </g>
      <g fill="#f6d9a8" opacity="0.8">
        <rect x="138" y="152" width="6" height="6" rx="1"/>
        <rect x="180" y="136" width="6" height="6" rx="1"/>
        <rect x="180" y="166" width="6" height="6" rx="1"/>
        <rect x="222" y="162" width="6" height="6" rx="1"/>
        <rect x="278" y="148" width="6" height="6" rx="1"/>
      </g>
      <path d="M100 230 H 380" stroke="rgba(240,194,127,0.35)" stroke-width="3" stroke-linecap="round"/>
      <text x="24" y="240" fill="rgba(255,255,255,0.8)" font-size="17" font-weight="600" font-family="ui-sans-serif, system-ui, sans-serif">Ночь · дежурный контур</text>
      <text x="24" y="50" fill="rgba(255,255,255,0.45)" font-size="12" font-family="ui-sans-serif, system-ui, sans-serif">CORE 40% · тихий город</text>
    </g>
  </g>
</svg>
