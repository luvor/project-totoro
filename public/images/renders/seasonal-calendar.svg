<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Сезонный календарь — годовое кольцо операционных режимов района">
  <defs>
    <linearGradient id="sc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1d2c"/>
      <stop offset="100%" stop-color="#122132"/>
    </linearGradient>
  </defs>

  <rect width="960" height="600" fill="url(#sc-bg)"/>

  <!-- годовое кольцо: 12 секторов -->
  <g transform="translate(340,300)">
    <circle r="218" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.06)"/>

    <!-- зима: Ноя–Мар (5 секторов сверху-слева) -->
    <g fill="none" stroke-width="52">
      <!-- сектор ~28° каждый с зазором: рисуем дугами r=180 -->
      <circle r="180" stroke="rgba(146,189,210,0.35)" stroke-dasharray="82 1049" transform="rotate(-104)"/>
      <circle r="180" stroke="rgba(146,189,210,0.42)" stroke-dasharray="82 1049" transform="rotate(-74)"/>
      <circle r="180" stroke="rgba(146,189,210,0.5)" stroke-dasharray="82 1049" transform="rotate(-44)"/>
      <circle r="180" stroke="rgba(146,189,210,0.42)" stroke-dasharray="82 1049" transform="rotate(-14)"/>
      <circle r="180" stroke="rgba(146,189,210,0.35)" stroke-dasharray="82 1049" transform="rotate(16)"/>
      <!-- межсезонье: Апр, Май -->
      <circle r="180" stroke="rgba(137,178,110,0.32)" stroke-dasharray="82 1049" transform="rotate(46)"/>
      <circle r="180" stroke="rgba(137,178,110,0.4)" stroke-dasharray="82 1049" transform="rotate(76)"/>
      <!-- лето: Июн–Авг -->
      <circle r="180" stroke="rgba(240,194,127,0.5)" stroke-dasharray="82 1049" transform="rotate(106)"/>
      <circle r="180" stroke="rgba(240,194,127,0.58)" stroke-dasharray="82 1049" transform="rotate(136)"/>
      <circle r="180" stroke="rgba(240,194,127,0.5)" stroke-dasharray="82 1049" transform="rotate(166)"/>
      <!-- осень: Сен, Окт -->
      <circle r="180" stroke="rgba(137,178,110,0.36)" stroke-dasharray="82 1049" transform="rotate(196)"/>
      <circle r="180" stroke="rgba(146,189,210,0.3)" stroke-dasharray="82 1049" transform="rotate(226)"/>
    </g>

    <!-- метки месяцев -->
    <g fill="rgba(255,255,255,0.55)" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
      <text x="0" y="-232">Янв</text>
      <text x="116" y="-200">Фев</text>
      <text x="204" y="-112">Мар</text>
      <text x="238" y="6">Апр</text>
      <text x="204" y="124">Май</text>
      <text x="116" y="212">Июн</text>
      <text x="0" y="246">Июл</text>
      <text x="-116" y="212">Авг</text>
      <text x="-204" y="124">Сен</text>
      <text x="-238" y="6">Окт</text>
      <text x="-204" y="-112">Ноя</text>
      <text x="-116" y="-200">Дек</text>
    </g>

    <!-- ядро -->
    <circle r="96" fill="rgba(240,194,127,0.08)" stroke="rgba(240,194,127,0.35)"/>
    <circle r="58" fill="rgba(240,194,127,0.16)"/>
    <g fill="rgba(255,255,255,0.85)" font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
      <text y="-6" font-size="16" font-weight="700">Один район</text>
      <text y="16" font-size="12" fill="rgba(255,255,255,0.55)">4 режима работы</text>
    </g>
  </g>

  <!-- легенда режимов -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" transform="translate(650,120)">
    <text fill="rgba(255,255,255,0.85)" font-size="22" font-weight="700">Годовой цикл</text>
    <text y="26" fill="rgba(255,255,255,0.45)" font-size="13">Режимы переключаются планово,</text>
    <text y="44" fill="rgba(255,255,255,0.45)" font-size="13">а не в ответ на аварию</text>

    <g transform="translate(0,84)">
      <rect width="14" height="14" rx="4" fill="rgba(146,189,210,0.6)"/>
      <text x="24" y="12" fill="rgba(255,255,255,0.7)" font-size="14">Зима: тёплый контур, CORE 100%</text>
    </g>
    <g transform="translate(0,120)">
      <rect width="14" height="14" rx="4" fill="rgba(137,178,110,0.6)"/>
      <text x="24" y="12" fill="rgba(255,255,255,0.7)" font-size="14">Межсезонье: проветривание, ремонт</text>
    </g>
    <g transform="translate(0,156)">
      <rect width="14" height="14" rx="4" fill="rgba(240,194,127,0.7)"/>
      <text x="24" y="12" fill="rgba(255,255,255,0.7)" font-size="14">Лето: тень, night purge, вода</text>
    </g>
    <g transform="translate(0,192)">
      <rect width="14" height="14" rx="4" fill="rgba(146,189,210,0.35)"/>
      <text x="24" y="12" fill="rgba(255,255,255,0.7)" font-size="14">Осень: подготовка к зиме, запасы</text>
    </g>

    <g transform="translate(0,252)">
      <rect width="252" height="86" rx="14" fill="rgba(240,194,127,0.08)" stroke="rgba(240,194,127,0.3)"/>
      <text x="18" y="32" fill="#f0c27f" font-size="14" font-weight="600">Переходные недели</text>
      <text x="18" y="54" fill="rgba(255,255,255,0.55)" font-size="12">Апрель и октябрь — стресс-тесты:</text>
      <text x="18" y="72" fill="rgba(255,255,255,0.55)" font-size="12">город репетирует смену режима</text>
    </g>
  </g>
</svg>
