<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Метрики процветания — панель показателей района">
  <defs>
    <linearGradient id="fm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1d2c"/>
      <stop offset="100%" stop-color="#122132"/>
    </linearGradient>
    <linearGradient id="fm-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#315b73"/>
      <stop offset="100%" stop-color="#92bdd2"/>
    </linearGradient>
  </defs>

  <rect width="960" height="600" fill="url(#fm-bg)"/>
  <rect x="28" y="28" width="904" height="544" rx="24" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="64" y="86" fill="rgba(255,255,255,0.85)" font-size="24" font-weight="700">Метрики процветания</text>
    <text x="64" y="112" fill="rgba(255,255,255,0.45)" font-size="14">Каждая метрика — проверяемое обещание среды, не гарантия здоровья</text>

    <!-- карточки-показатели -->
    <g>
      <rect x="64" y="146" width="256" height="130" rx="16" fill="rgba(240,194,127,0.10)" stroke="rgba(240,194,127,0.3)"/>
      <text x="88" y="196" fill="#f0c27f" font-size="34" font-weight="700">15 мин</text>
      <text x="88" y="224" fill="rgba(255,255,255,0.6)" font-size="13">до школы, клиники и парка</text>
      <text x="88" y="244" fill="rgba(255,255,255,0.6)" font-size="13">пешком в любой сезон</text>

      <rect x="352" y="146" width="256" height="130" rx="16" fill="rgba(137,178,110,0.10)" stroke="rgba(137,178,110,0.3)"/>
      <text x="376" y="196" fill="#a5c98c" font-size="34" font-weight="700">3–30–300</text>
      <text x="376" y="224" fill="rgba(255,255,255,0.6)" font-size="13">3 дерева из окна · 30% кроны</text>
      <text x="376" y="244" fill="rgba(255,255,255,0.6)" font-size="13">300 м до зелени</text>

      <rect x="640" y="146" width="256" height="130" rx="16" fill="rgba(146,189,210,0.10)" stroke="rgba(146,189,210,0.3)"/>
      <text x="664" y="196" fill="#92bdd2" font-size="34" font-weight="700">8-and-80</text>
      <text x="664" y="224" fill="rgba(255,255,255,0.6)" font-size="13">среда работает и для ребёнка,</text>
      <text x="664" y="244" fill="rgba(255,255,255,0.6)" font-size="13">и для пожилого человека</text>
    </g>

    <!-- бар-чарт: суточная активность улицы -->
    <g>
      <text x="64" y="336" fill="rgba(255,255,255,0.7)" font-size="15" font-weight="600">Активность общественных пространств по сезонам</text>
      <g>
        <rect x="80" y="440" width="52" height="72" rx="6" fill="url(#fm-bar)" opacity="0.9"/>
        <rect x="150" y="416" width="52" height="96" rx="6" fill="url(#fm-bar)" opacity="0.9"/>
        <rect x="220" y="392" width="52" height="120" rx="6" fill="url(#fm-bar)" opacity="0.9"/>
        <rect x="290" y="372" width="52" height="140" rx="6" fill="#f0c27f" opacity="0.85"/>
        <rect x="360" y="386" width="52" height="126" rx="6" fill="url(#fm-bar)" opacity="0.9"/>
        <rect x="430" y="410" width="52" height="102" rx="6" fill="url(#fm-bar)" opacity="0.9"/>
        <rect x="500" y="434" width="52" height="78" rx="6" fill="url(#fm-bar)" opacity="0.9"/>
      </g>
      <path d="M80 512 H 552" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
      <g fill="rgba(255,255,255,0.45)" font-size="12" text-anchor="middle">
        <text x="106" y="534">Янв</text><text x="176" y="534">Мар</text><text x="246" y="534">Май</text>
        <text x="316" y="534">Июл</text><text x="386" y="534">Сен</text><text x="456" y="534">Ноя</text>
        <text x="526" y="534">Дек</text>
      </g>
      <text x="316" y="360" fill="rgba(240,194,127,0.8)" font-size="12" text-anchor="middle">пик: лето</text>
    </g>

    <!-- донат: доля маршрутов в тепле -->
    <g transform="translate(740,430)">
      <circle r="86" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="20"/>
      <circle r="86" fill="none" stroke="#f0c27f" stroke-width="20" stroke-linecap="round"
        stroke-dasharray="405 540" transform="rotate(-90)"/>
      <text y="-2" fill="rgba(255,255,255,0.9)" font-size="34" font-weight="700" text-anchor="middle">75%</text>
      <text y="24" fill="rgba(255,255,255,0.5)" font-size="12" text-anchor="middle">зимних маршрутов —</text>
      <text y="42" fill="rgba(255,255,255,0.5)" font-size="12" text-anchor="middle">в тёплом контуре</text>
    </g>
  </g>
</svg>
